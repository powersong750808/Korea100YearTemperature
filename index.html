<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>100년 관측소 연평균기온</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f7fb;color:#18283d;margin:0}
    .wrap{max-width:1100px;margin:36px auto;padding:0 18px}
    .panel{background:white;border-radius:18px;padding:25px;box-shadow:0 6px 25px #1c35521a}
    h1{margin:0 0 12px}p{color:#52647a}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
    .tab{border:1px solid #d2dce9;background:#f6f9fc;color:#263b53;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:15px}
    .tab.active{background:#1769aa;color:white;border-color:#1769aa;font-weight:700}
    #status{margin:15px 0;color:#45576a}
    #trendSummary{margin:0 0 14px;color:#a33434;font-weight:700}
    .chart{height:480px;position:relative}
    footer{font-size:13px;color:#6b7889;margin-top:18px}
    @media(max-width:600px){.chart{height:370px}}
  </style>
</head>
<body>
<main class="wrap"><div class="panel">
  <h1>대한민국 100년 관측소 연평균기온</h1>
  <p>기상청 공식 관측자료 · 연도별 평균기온(℃) · 지난해까지의 확정 관측자료</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="관측소 선택"></div>
  <div id="status">관측자료를 불러오는 중입니다.</div>
  <div id="trendSummary" aria-live="polite"></div>
  <div class="chart"><canvas id="chart"></canvas></div>
  <footer id="source">자료 출처: 기상청 API허브 · 지상기상연보 연요약자료</footer>
</div></main>
<script>
let records = {}, chart, selected = '서울';
const names = ['서울','부산','제주','인천','목포','대구','강릉','전주'];
const cutoff = new Date().getFullYear() - 1;
const status = document.getElementById('status');
const tabs = document.getElementById('tabs');
const trendSummary = document.getElementById('trendSummary');

function selectStation(name) {
  selected = name;
  tabs.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.textContent === name);
    b.setAttribute('aria-selected', String(b.textContent === name));
  });
  draw();
}

names.forEach(name => {
  const b = document.createElement('button');
  b.className = 'tab' + (name === selected ? ' active' : '');
  b.textContent = name;
  b.type = 'button';
  b.setAttribute('role','tab');
  b.setAttribute('aria-selected', String(name === selected));
  b.addEventListener('click', () => selectStation(name));
  tabs.appendChild(b);
});

// 실제 관측 연도를 X로 사용해 최소제곱 선형회귀를 계산합니다.
function linearTrend(years, values) {
  const n = years.length;
  if (n < 2) return null;
  const meanX = years.reduce((s, x) => s + x, 0) / n;
  const meanY = values.reduce((s, y) => s + y, 0) / n;
  let numerator = 0, denominator = 0;
  for (let i = 0; i < n; i++) {
    numerator += (years[i] - meanX) * (values[i] - meanY);
    denominator += (years[i] - meanX) ** 2;
  }
  if (denominator === 0) return null;
  const slope = numerator / denominator;
  return { slope, values: years.map(x => meanY + slope * (x - meanX)) };
}

function draw() {
  const name = selected;
  const rows = Object.entries(records)
    .filter(([year, data]) => Number(year) <= cutoff && data && Number.isFinite(data[name]))
    .sort((a,b) => +a[0] - +b[0]);
  if (!rows.length) {
    status.textContent = name + ' 관측소에 표시할 실제 연평균기온 자료가 없습니다.';
    trendSummary.textContent = '';
    if (chart) { chart.destroy(); chart = null; }
    return;
  }
  const labels = rows.map(([year]) => year);
  const years = labels.map(Number);
  const values = rows.map(([, data]) => data[name]);
  const trend = linearTrend(years, values);
  status.textContent = `${name}: ${labels[0]}~${labels.at(-1)}년 · ${rows.length}개 연도 관측자료`;
  trendSummary.textContent = trend
    ? `장기 선형 추세: 10년당 ${trend.slope >= 0 ? '+' : ''}${(trend.slope * 10).toFixed(3)}℃ (${labels[0]}~${labels.at(-1)}년 기준)`
    : '추세선을 계산하기 위한 관측 연도가 부족합니다.';

  const datasets = [{
    label: name + ' 연평균기온 (℃)', data: values,
    borderColor: '#1677bd', backgroundColor: '#1677bd',
    pointRadius: 1.6, borderWidth: 2, tension: .12
  }];
  if (trend) datasets.push({
    label: '장기 선형 추세선', data: trend.values,
    borderColor: '#d94841', backgroundColor: '#d94841',
    borderDash: [8,5], pointRadius: 0, pointHoverRadius: 0,
    borderWidth: 3, tension: 0
  });

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true },
        tooltip: { callbacks: {
          label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)} ℃`
        }}
      },
      scales: {
        x: { title: { display: true, text: '연도' }, ticks: { maxTicksLimit: 14 } },
        y: { title: { display: true, text: '연평균기온 (℃)' } }
      }
    }
  });
}

fetch('temperature.json?ts=' + Date.now())
  .then(r => { if (!r.ok) throw Error('자료 파일 없음'); return r.json(); })
  .then(data => {
    records = data.records || {};
    document.getElementById('source').textContent = '자료 출처: ' + data.source + ' · 갱신: ' + data.updated_at;
    draw();
  })
  .catch(e => {
    status.textContent = '실제 관측자료를 아직 불러오지 못했습니다. 자동 수집 작업과 인증키 설정을 확인하세요. (' + e.message + ')';
  });
</script>
</body>
</html>
