<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>100년 관측소 연평균기온</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f7fb;color:#18283d;margin:0}
    .wrap{max-width:1100px;margin:36px auto;padding:0 18px}
    .panel{background:white;border-radius:18px;padding:25px;box-shadow:0 6px 25px #1c35521a}
    h1{margin:0 0 12px}p{color:#52647a}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
    .tab{border:1px solid #d2dce9;background:#f6f9fc;color:#263b53;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:15px}
    .tab.active{background:#1769aa;color:white;border-color:#1769aa;font-weight:700}
    #status{margin:15px 0;color:#45576a}
    #trendSummary{margin:0 0 14px;color:#a33434;font-weight:700}
    .chart{height:480px;position:relative}
    footer{font-size:13px;color:#6b7889;margin-top:18px}
    @media(max-width:600px){.chart{height:370px}}
  </style>
</head>
<body>
<main class="wrap"><div class="panel">
  <h1>대한민국 100년 관측소 기온변화</h1>
  <p>기상청 ASOS 관측자료 · 연평균기온 및 연최고기온(℃) · 지난해까지의 자료</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="관측소 선택"></div>
  <div id="status">관측자료를 불러오는 중입니다.</div>
  <div id="trendSummary" aria-live="polite"></div>
  <div class="chart"><canvas id="chart"></canvas></div>
  <footer id="source">자료 출처: 기상청 API허브 · 지상기상연보 연요약자료</footer>
</div></main>
<script>
let records = {}, maxRecords = {}, chart, selected = '서울';
const names = ['서울','부산','제주','인천','목포','대구','강릉','전주'];
const cutoff = new Date().getFullYear() - 1;
const status = document.getElementById('status');
const tabs = document.getElementById('tabs');
const trendSummary = document.getElementById('trendSummary');
const maxInfo = document.createElement('div');
maxInfo.style.cssText = 'margin:0 0 12px;color:#9a4e16;font-weight:700';
trendSummary.after(maxInfo);

function selectStation(name) {
  selected = name;
  tabs.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.textContent === name);
    b.setAttribute('aria-selected', String(b.textContent === name));
  });
  draw();
}

names.forEach(name => {
  const b = document.createElement('button');
  b.className = 'tab' + (name === selected ? ' active' : '');
  b.textContent = name;
  b.type = 'button';
  b.setAttribute('role','tab');
  b.setAttribute('aria-selected', String(name === selected));
  b.addEventListener('click', () => selectStation(name));
  tabs.appendChild(b);
});

// 실제 관측 연도를 X로 사용해 최소제곱 선형회귀를 계산합니다.
function linearTrend(years, values) {
  const n = years.length;
  if (n < 2) return null;
  const meanX = years.reduce((s, x) => s + x, 0) / n;
  const meanY = values.reduce((s, y) => s + y, 0) / n;
  let numerator = 0, denominator = 0;
  for (let i = 0; i < n; i++) {
    numerator += (years[i] - meanX) * (values[i] - meanY);
    denominator += (years[i] - meanX) ** 2;
  }
  if (denominator === 0) return null;
  const slope = numerator / denominator;
  return { slope, values: years.map(x => meanY + slope * (x - meanX)) };
}

function draw() {
  const name = selected;
  const avgRows = Object.entries(records)
    .filter(([year, data]) => +year <= cutoff && data && Number.isFinite(data[name]));
  const highRows = Object.entries(maxRecords)
    .filter(([year, data]) => +year <= cutoff && data && Number.isFinite(data[name]));
  const years = [...new Set([...avgRows, ...highRows].map(([year]) => +year))]
    .sort((a,b) => a-b);
  if (!years.length) {
    status.textContent = name + ' 관측소에 표시할 자료가 없습니다.';
    trendSummary.textContent = '';
    maxInfo.textContent = '';
    if (chart) { chart.destroy(); chart = null; }
    return;
  }
  const avgMap = Object.fromEntries(avgRows.map(([y, d]) => [+y, d[name]]));
  const highMap = Object.fromEntries(highRows.map(([y, d]) => [+y, d[name]]));
  const averageYears = years.filter(y => Number.isFinite(avgMap[y]));
  const highYears = years.filter(y => Number.isFinite(highMap[y]));
  const avgTrend = linearTrend(averageYears, averageYears.map(y => avgMap[y]));
  const highTrend = linearTrend(highYears, highYears.map(y => highMap[y]));
  const fmt = (t) => `${t.slope >= 0 ? '+' : ''}${(t.slope * 10).toFixed(3)}℃/10년`;
  status.textContent = `${name}: ${years[0]}~${years.at(-1)}년 · 연평균 ${averageYears.length}개 연도 · 연최고 ${highYears.length}개 연도`;
  trendSummary.textContent = avgTrend
    ? `연평균기온 장기 추세: ${fmt(avgTrend)} (${averageYears[0]}~${averageYears.at(-1)}년)`
    : '연평균기온 추세를 계산할 자료가 부족합니다.';
  maxInfo.textContent = highTrend
    ? `연최고기온 장기 추세: ${fmt(highTrend)} (${highYears[0]}~${highYears.at(-1)}년)`
    : '연최고기온 자료를 수집 중입니다. GitHub Actions 실행 후 표시됩니다.';
  const dataFor = map => years.map(y => Number.isFinite(map[y]) ? map[y] : null);
  const trendFor = (t, ys) => years.map(y =>
    t && y >= ys[0] && y <= ys.at(-1)
      ? t.values[0] + t.slope * (y - ys[0]) : null);
  const datasets = [
    { label:'연평균기온 (℃)', data:dataFor(avgMap), borderColor:'#1677bd',
      backgroundColor:'#1677bd', pointRadius:1.6, borderWidth:2, tension:0, spanGaps:false },
    { label:'연평균기온 추세선', data:trendFor(avgTrend, averageYears),
      borderColor:'#d94841', borderDash:[8,5], pointRadius:0, borderWidth:3, spanGaps:true },
    { label:'연최고기온 (℃)', data:dataFor(highMap), borderColor:'#e58a20',
      backgroundColor:'#e58a20', pointRadius:1.6, borderWidth:2, tension:0, spanGaps:false },
    { label:'연최고기온 추세선', data:trendFor(highTrend, highYears),
      borderColor:'#8a50b4', borderDash:[8,5], pointRadius:0, borderWidth:3, spanGaps:true }
  ];
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type:'line', data:{labels:years.map(String), datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:true},
        tooltip:{callbacks:{label:ctx =>
          ctx.parsed.y === null ? '' : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)} ℃`}}
      },
      scales:{
        x:{title:{display:true,text:'연도'},ticks:{maxTicksLimit:14}},
        y:{title:{display:true,text:'기온 (℃)'}}
      }
    }
  });
}

fetch('temperature.json?ts=' + Date.now())
  .then(r => { if (!r.ok) throw Error('자료 파일 없음'); return r.json(); })
  .then(data => {
    records = data.records || {};
    maxRecords = data.max_records || {};
    document.getElementById('source').textContent = '자료 출처: ' + data.source + ' · 갱신: ' + data.updated_at;
    draw();
  })
  .catch(e => {
    status.textContent = '실제 관측자료를 아직 불러오지 못했습니다. 자동 수집 작업과 인증키 설정을 확인하세요. (' + e.message + ')';
  });
</script>
</body>
</html>
