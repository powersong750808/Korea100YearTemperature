name: Update annual temperature

on:
  workflow_dispatch:
  schedule:
    # Daily backfill until history is complete, then periodic checks.
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: temperature-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch KMA annual temperatures
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python fetch_temperature.py
      - name: Commit accumulated observations
        run: |
          if git diff --quiet -- temperature.json; then
            echo 'No new observations to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temperature.json
          git commit -m 'Update annual temperature observations'
          git push

